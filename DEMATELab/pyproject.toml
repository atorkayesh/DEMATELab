[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DEMATELab"
version = "0.1.0"
description = "DEMATEL Desktop Tool with LLM explanation"
authors = [
    { name = "Ali Torkayesh" }
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "google-genai>=1.0.0",
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "openpyxl",
    "qtawesome"
]

[project.scripts]
DEMATELab = "DEMATELab.gui_app:main"

[tool.setuptools]
packages = ["DEMATELab"]
