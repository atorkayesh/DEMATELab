name: dematelab-prod

services:
  dematelab:
    container_name: dematelab-prod
    image: dematelab:prod
    build:
      context: ./DEMATELab
      dockerfile: Dockerfile.prod
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    env_file:
      # Must define VNC_PASSWORD; the container refuses to start without it.
      - path: ./DEMATELab/.env
        required: true
    environment:
      - APP_MODE=prod
    ports:
      # Localhost by default; set NOVNC_BIND=0.0.0.0 only behind a TLS reverse proxy or firewall.
      - "${NOVNC_BIND:-127.0.0.1}:${NOVNC_PORT:-6080}:6080"
    volumes:
      - ./Example data:/workspace/examples:ro
      - dematelab-exports:/workspace/exports
    shm_size: 256mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  dematelab-exports:
    name: dematelab-exports
