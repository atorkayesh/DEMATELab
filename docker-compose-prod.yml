name: dematelab

services:
  web:
    container_name: dematelab-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    env_file:
      - ./apps/web/.env
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped

  api:
    container_name: dematelab-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    # API settings come from the API's own env file; Compose overrides only what Docker decides.
    # Stateless: no volume.
    env_file:
      - ./apps/api/.env
    environment:
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:50001/api/v1/is-alive')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    container_name: dematelab-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    # The only service published to the outside. Add "443:443" with HTTPS.
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
