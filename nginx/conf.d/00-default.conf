# Shared settings and the catch-all servers. Per-app servers: dematelab.conf, policycoherencekit.conf.

# Docker's embedded DNS. Upstreams are set through variables, so they are resolved per request: Nginx
# starts while an app is down (that host answers 502) and never keeps stale IPs after a container is
# recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1h;

# Requests by IP address or for an unknown host name: no app is served.
# To send bare-IP visitors to one app instead, replace `return 444;` with
#   return 301 https://dematelab.example.com$request_uri;
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
