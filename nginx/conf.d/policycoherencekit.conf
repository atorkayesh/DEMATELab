# Policy Coherence Kit: https://policycoherence.example.com
# App containers come from that repo's docker-compose-prod.yml (`just prod`).
# Upstreams use container names (unique on the shared `proxy` network), never the service names web/api.

# HTTP -> HTTPS on the main name.
server {
    listen 80;
    server_name policycoherence.example.com;
    return 301 https://policycoherence.example.com$request_uri;
}

# www. -> the main name, permanently (HTTP and HTTPS). The certificate covers www. too.
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.policycoherence.example.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    return 301 https://policycoherence.example.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name policycoherence.example.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # A 100-policy x 50-decision-maker analysis request (rating labels) is about 7-8 MB of JSON.
    client_max_body_size 20m;

    set $pck_web http://policycoherencekit-web:3001;
    set $pck_api http://policycoherencekit-api:50002;

    location / {
        proxy_pass $pck_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $pck_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI interpretations can take up to 120 s at the provider.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ROLLBACK (HTTP only, how the app was served before HTTPS). If HTTPS breaks
