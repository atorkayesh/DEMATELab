# Shared HTTPS proxy for the VPS: the only container publishing ports 80 and 443. Routes by host name to
# DEMATELab and Policy Coherence Kit (see templates/). Run it through the justfile: `just proxy <recipe>` from
# the repo root, or `just <recipe>` in this folder. See README.md.
name: proxy

services:
  nginx:
    image: nginx:stable-alpine
    container_name: proxy-nginx
    ports:
      - "${PROXY_BIND_IP:+${PROXY_BIND_IP}:}80:80"
      - "${PROXY_BIND_IP:+${PROXY_BIND_IP}:}443:443"
    environment:
      NGINX_ENVSUBST_FILTER: '^PROXY_(DEMATELAB_HOST|PCK_HOST|TLS_CERT|TLS_KEY)$$'
      PROXY_DEMATELAB_HOST: ${PROXY_DEMATELAB_HOST:?Set the DEMATELab hostname}
      PROXY_PCK_HOST: ${PROXY_PCK_HOST:?Set the Policy Coherence Kit hostname}
      PROXY_TLS_CERT: ${PROXY_TLS_CERT:?Set the TLS certificate filename}
      PROXY_TLS_KEY: ${PROXY_TLS_KEY:?Set the TLS key filename}
    volumes:
      - ./templates:/etc/nginx/templates:ro
      - type: bind
        source: ${PROXY_CERT_DIR:?Set the host certificate directory}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    networks:
      - proxy
    restart: unless-stopped

networks:
  # Created by `just proxy network` (and by each repo's `just prod`); external so that stopping one project
  # or the proxy never deletes it.
  proxy:
    external: true
    name: proxy
