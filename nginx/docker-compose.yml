# Shared HTTPS proxy for the VPS: the only container publishing ports 80 and 443. Routes by host name to
# DEMATELab and Policy Coherence Kit (see conf.d/). Run it through the justfile: `just proxy <recipe>` from
# the repo root, or `just <recipe>` in this folder. See README.md.
name: proxy

services:
  nginx:
    image: nginx:stable-alpine
    container_name: proxy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mounted, not baked into an image, so `just nginx-reload` applies edits without a rebuild.
      - ./conf.d:/etc/nginx/conf.d:ro
      # One institutional certificate covers all four host names (see README).
      - /srv/certificates:/etc/nginx/certs:ro
    networks:
      - proxy
    restart: unless-stopped

networks:
  # Created by `just proxy network` (and by each repo's `just prod`); external so that stopping one project
  # or the proxy never deletes it.
  proxy:
    external: true
    name: proxy
