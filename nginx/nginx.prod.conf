# The container's own DNS server, filled in at startup from /etc/resolv.conf (Dockerfile.prod):
# Docker uses 127.0.0.11, podman the network gateway (e.g. 10.89.0.1), so it cannot be hardcoded.
# Upstreams are resolved per request, so Nginx starts while web does not exist yet (/ then answers 502)
# and does not keep stale container IPs after web or api are recreated.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    # A 100-factor x 50-expert analysis request is about 10 MB of JSON.
    client_max_body_size 20m;

    set $web_upstream http://web:3000;
    set $api_upstream http://api:50001;

    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI explanations can take up to 120 s at the provider.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

